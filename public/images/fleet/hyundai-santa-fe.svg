<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Hyundai Santa Fe">
  <defs>
    <linearGradient id="hsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2f5c"/>
      <stop offset="0.5" stop-color="#3d7fb8"/>
      <stop offset="1" stop-color="#c6e2f2"/>
    </linearGradient>
    <radialGradient id="hsSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hsPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb0cc"/>
      <stop offset="1" stop-color="#6c81a4"/>
    </linearGradient>
    <linearGradient id="hsRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37465f"/>
      <stop offset="1" stop-color="#222f48"/>
    </linearGradient>
    <linearGradient id="hsGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="hsBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b486"/>
      <stop offset="0.5" stop-color="#b08a55"/>
      <stop offset="1" stop-color="#7e5e34"/>
    </linearGradient>
    <linearGradient id="hsGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff0ff"/>
      <stop offset="1" stop-color="#7ea9cc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#hsSky)"/>
  <circle cx="360" cy="160" r="180" fill="url(#hsSun)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="780" cy="130" rx="100" ry="22"/>
    <ellipse cx="860" cy="118" rx="60" ry="16"/>
    <ellipse cx="1040" cy="180" rx="80" ry="18"/>
  </g>

  <!-- far peaks -->
  <polygon points="0,340 170,205 340,320 520,185 700,320 880,195 1060,320 1200,235 1200,420 0,420" fill="url(#hsPeak)"/>
  <g fill="#eef2f9" opacity="0.92">
    <polygon points="520,185 562,266 478,264"/>
    <polygon points="880,195 920,270 840,268"/>
  </g>

  <!-- near ridge -->
  <polygon points="0,470 240,416 480,470 720,418 960,472 1180,426 1200,452 1200,540 0,540" fill="url(#hsRidge)"/>

  <!-- road -->
  <polygon points="0,750 0,560 1200,520 1200,750" fill="url(#hsGround)"/>
  <rect x="0" y="556" width="1200" height="10" fill="#2a3650" opacity="0.6"/>
  <path d="M0,640 L1200,610" stroke="#f59e0b" stroke-width="3" stroke-dasharray="26 22" opacity="0.4"/>

  <!-- ===== HYUNDAI SANTA FE: sleek modern crossover, bronze/sand, coupe-ish fastback ===== -->
  <g transform="translate(600,560)">
    <ellipse cx="0" cy="36" rx="234" ry="20" fill="#000" opacity="0.3"/>

    <!-- flowing body, fast windscreen, tapered fastback rear -->
    <path d="M-228,28 L-228,-14 Q-224,-30 -196,-40 L-128,-84 Q-108,-94 -76,-94 L96,-94 Q132,-94 154,-72 L200,-40 Q228,-32 228,-6 L228,16 Q228,28 214,28 Z" fill="url(#hsBody)"/>
    <!-- bronze highlight sweep -->
    <path d="M-224,-10 Q0,-26 226,-2" fill="none" stroke="#e7c89a" stroke-width="3" opacity="0.7"/>
    <!-- character line -->
    <path d="M-200,4 Q0,-6 214,8" fill="none" stroke="#6e5230" stroke-width="2" opacity="0.6"/>
    <!-- lower cladding -->
    <rect x="-228" y="8" width="456" height="20" rx="3" fill="#1a2233"/>

    <!-- low-profile roof rail -->
    <rect x="-112" y="-98" width="200" height="6" rx="3" fill="#23303f"/>

    <!-- sleek greenhouse, fastback drop at rear -->
    <path d="M-126,-80 L-108,-46 L150,-46 L88,-90 L-76,-90 L-126,-80 Z" fill="#161d29"/>
    <!-- raked windscreen -->
    <polygon points="-124,-76 -82,-86 -76,-48 -104,-48" fill="url(#hsGlass)" opacity="0.92"/>
    <!-- front side window -->
    <rect x="-66" y="-86" width="56" height="38" fill="url(#hsGlass)" opacity="0.9"/>
    <!-- rear window tapering up -->
    <polygon points="0,-86 60,-86 96,-48 0,-48" fill="url(#hsGlass)" opacity="0.85"/>

    <!-- door lines -->
    <g stroke="#6e5230" stroke-width="2" opacity="0.7">
      <line x1="-66" y1="-46" x2="-66" y2="8"/>
      <line x1="-2" y1="-46" x2="-2" y2="8"/>
      <line x1="60" y1="-46" x2="60" y2="8"/>
    </g>
    <g fill="#5c4424">
      <rect x="-40" y="-26" width="18" height="5" rx="2"/>
      <rect x="22" y="-26" width="18" height="5" rx="2"/>
    </g>

    <!-- front: sloped nose, signature slim H-style headlight -->
    <polygon points="200,-40 228,-6 228,4 206,4 196,-26" fill="#5c4424"/>
    <rect x="206" y="-26" width="22" height="5" rx="2" fill="#fff7df"/>
    <rect x="206" y="-16" width="22" height="4" rx="2" fill="#9fd8ff" opacity="0.8"/>
    <!-- slim wraparound taillight -->
    <rect x="-228" y="-12" width="6" height="22" rx="2" fill="#ff5a4d"/>
    <rect x="-226" y="-2" width="40" height="3" fill="#ff5a4d" opacity="0.7"/>

    <!-- rounded wheel arches -->
    <path d="M-180,30 A46,46 0 0 1 -88,30 Z" fill="#0b1120"/>
    <path d="M88,30 A46,46 0 0 1 180,30 Z" fill="#0b1120"/>

    <!-- alloy wheels (turbine-style) -->
    <g>
      <circle cx="-134" cy="30" r="42" fill="#11161f"/>
      <circle cx="-134" cy="30" r="42" fill="none" stroke="#2c3a55" stroke-width="6"/>
      <circle cx="-134" cy="30" r="20" fill="#cdd6e6"/>
      <circle cx="-134" cy="30" r="7" fill="#3b4452"/>
      <g stroke="#3b4452" stroke-width="3">
        <line x1="-134" y1="12" x2="-134" y2="48"/>
        <line x1="-152" y1="20" x2="-116" y2="40"/>
        <line x1="-152" y1="40" x2="-116" y2="20"/>
        <line x1="-152" y1="30" x2="-116" y2="30"/>
      </g>
    </g>
    <g>
      <circle cx="134" cy="30" r="42" fill="#11161f"/>
      <circle cx="134" cy="30" r="42" fill="none" stroke="#2c3a55" stroke-width="6"/>
      <circle cx="134" cy="30" r="20" fill="#cdd6e6"/>
      <circle cx="134" cy="30" r="7" fill="#3b4452"/>
      <g stroke="#3b4452" stroke-width="3">
        <line x1="134" y1="12" x2="134" y2="48"/>
        <line x1="116" y1="20" x2="152" y2="40"/>
        <line x1="116" y1="40" x2="152" y2="20"/>
        <line x1="116" y1="30" x2="152" y2="30"/>
      </g>
    </g>
  </g>

  <text x="46" y="56" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#eef2f9">JEEP<tspan fill="#f59e0b">.ALATAU</tspan></text>
  <text x="44" y="712" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#eef2f9">Hyundai Santa Fe</text>
</svg>
