<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Assy Plateau">
  <defs>
    <linearGradient id="asSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.45" stop-color="#26285c"/>
      <stop offset="0.78" stop-color="#7c4a76"/>
      <stop offset="1" stop-color="#e0915f"/>
    </linearGradient>
    <radialGradient id="asMoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fdf3da"/>
      <stop offset="0.4" stop-color="#fdf3da" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fdf3da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asRidgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5a78"/>
      <stop offset="1" stop-color="#473b5c"/>
    </linearGradient>
    <linearGradient id="asRidgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332d4c"/>
      <stop offset="1" stop-color="#211e38"/>
    </linearGradient>
    <linearGradient id="asPlateau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#asSky)"/>

  <!-- stars -->
  <g fill="#eef2f9">
    <circle cx="90" cy="70" r="1.6"/><circle cx="170" cy="120" r="1.2"/><circle cx="250" cy="60" r="1.8"/>
    <circle cx="330" cy="130" r="1.3"/><circle cx="420" cy="80" r="1.6"/><circle cx="500" cy="40" r="1.2"/>
    <circle cx="560" cy="110" r="1.7"/><circle cx="640" cy="70" r="1.3"/><circle cx="720" cy="120" r="1.5"/>
    <circle cx="160" cy="200" r="1.2"/><circle cx="60" cy="160" r="1.4"/><circle cx="300" cy="200" r="1.1"/>
    <circle cx="380" cy="170" r="1.5"/><circle cx="470" cy="210" r="1.2"/><circle cx="600" cy="180" r="1.3"/>
    <circle cx="800" cy="90" r="1.7"/><circle cx="880" cy="140" r="1.3"/><circle cx="1010" cy="80" r="1.6"/>
    <circle cx="1090" cy="130" r="1.2"/><circle cx="1150" cy="70" r="1.4"/><circle cx="960" cy="190" r="1.2"/>
    <circle cx="1120" cy="200" r="1.3"/><circle cx="700" cy="220" r="1.1"/><circle cx="240" cy="260" r="1.0"/>
  </g>
  <g fill="#eef2f9" opacity="0.85">
    <circle cx="250" cy="60" r="3.2"/><circle cx="800" cy="90" r="3"/><circle cx="1010" cy="80" r="2.8"/>
  </g>

  <!-- moon -->
  <circle cx="220" cy="150" r="150" fill="url(#asMoon)"/>
  <circle cx="220" cy="150" r="42" fill="#fdf3da"/>
  <circle cx="240" cy="138" r="42" fill="#26285c" opacity="0.45"/>

  <!-- far ridge -->
  <polygon points="0,360 180,290 360,350 560,280 760,350 960,290 1140,350 1200,320 1200,440 0,440" fill="url(#asRidgeFar)" opacity="0.85"/>

  <!-- mid ridge -->
  <polygon points="0,440 200,390 420,440 640,395 860,445 1080,400 1200,430 1200,520 0,520" fill="url(#asRidgeMid)"/>

  <!-- wide plateau ground -->
  <polygon points="0,520 0,750 1200,750 1200,490 950,500 600,520 300,510 0,520" fill="url(#asPlateau)"/>
  <!-- subtle ground grass tufts -->
  <g stroke="#2a3a4f" stroke-width="2" opacity="0.5">
    <path d="M120,620 l0,-12 M124,620 l3,-12 M116,620 l-3,-12"/>
    <path d="M980,640 l0,-12 M984,640 l3,-12 M976,640 l-3,-12"/>
    <path d="M520,690 l0,-12 M524,690 l3,-12 M516,690 l-3,-12"/>
  </g>

  <!-- domed astronomical observatory silhouette -->
  <g transform="translate(640,520)">
    <!-- base building -->
    <rect x="-46" y="-30" width="92" height="36" fill="#1a2436"/>
    <!-- dome -->
    <path d="M-40,-30 A40,40 0 0 1 40,-30 Z" fill="#222e44"/>
    <!-- dome slit -->
    <rect x="-5" y="-66" width="10" height="40" rx="4" fill="#0b1120"/>
    <!-- amber rim light catch -->
    <path d="M-40,-30 A40,40 0 0 1 -10,-58" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.5"/>
    <!-- small lit window -->
    <rect x="-30" y="-18" width="10" height="12" fill="#ffd27a" opacity="0.85"/>
    <rect x="18" y="-18" width="10" height="12" fill="#ffd27a" opacity="0.65"/>
  </g>

  <!-- yurts -->
  <g transform="translate(380,560)">
    <path d="M-44,0 L-40,-26 Q0,-44 40,-26 L44,0 Z" fill="#1c2740"/>
    <path d="M-40,-26 Q0,-58 40,-26" fill="#243353"/>
    <rect x="-10" y="-14" width="20" height="14" fill="#f59e0b" opacity="0.85"/>
    <path d="M-40,-26 L0,-50 L40,-26" fill="none" stroke="#33415b" stroke-width="2"/>
  </g>
  <g transform="translate(300,580) scale(0.82)">
    <path d="M-44,0 L-40,-26 Q0,-44 40,-26 L44,0 Z" fill="#1c2740"/>
    <path d="M-40,-26 Q0,-58 40,-26" fill="#243353"/>
    <rect x="-9" y="-14" width="18" height="14" fill="#ffd27a" opacity="0.7"/>
  </g>

  <!-- thin smoke from yurt -->
  <path d="M380,512 q-6,-20 4,-36 q8,-14 -2,-30" fill="none" stroke="#9fb0cc" stroke-width="2" opacity="0.3"/>

  <!-- distant parked 4x4 -->
  <g transform="translate(860,600) scale(0.7)">
    <ellipse cx="0" cy="30" rx="58" ry="7" fill="#000" opacity="0.3"/>
    <path d="M-54,14 L-54,-2 Q-52,-10 -42,-12 L-30,-24 Q-26,-28 -18,-28 L28,-28 Q36,-28 42,-22 L50,-12 Q56,-10 56,0 L56,14 Q56,20 50,20 L-48,20 Q-54,20 -54,14 Z" fill="#1a2436"/>
    <rect x="-26" y="-22" width="20" height="12" fill="#9fb0cc" opacity="0.6"/>
    <rect x="-2" y="-22" width="20" height="12" fill="#9fb0cc" opacity="0.55"/>
    <circle cx="54" cy="2" r="4" fill="#ffd27a"/>
    <circle cx="-34" cy="20" r="14" fill="#0a1322"/><circle cx="-34" cy="20" r="6" fill="#33415b"/>
    <circle cx="36" cy="20" r="14" fill="#0a1322"/><circle cx="36" cy="20" r="6" fill="#33415b"/>
  </g>

  <text x="46" y="56" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#eef2f9">JEEP<tspan fill="#f59e0b">.ALATAU</tspan></text>
  <text x="44" y="712" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#eef2f9">Assy Plateau</text>
</svg>
