<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Kolsai and Kaindy">
  <defs>
    <linearGradient id="kkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5a8a"/>
      <stop offset="0.6" stop-color="#5aa0c8"/>
      <stop offset="1" stop-color="#cfe6ef"/>
    </linearGradient>
    <linearGradient id="kkPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e93b0"/>
      <stop offset="1" stop-color="#56688a"/>
    </linearGradient>
    <linearGradient id="kkForestFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6b52"/>
      <stop offset="1" stop-color="#155442"/>
    </linearGradient>
    <linearGradient id="kkForestNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12503d"/>
      <stop offset="1" stop-color="#0b3a2c"/>
    </linearGradient>
    <linearGradient id="kkLakeUpper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2faf8a"/>
      <stop offset="1" stop-color="#137a5e"/>
    </linearGradient>
    <linearGradient id="kkLakeKaindy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#1f9d77"/>
      <stop offset="1" stop-color="#0e6b50"/>
    </linearGradient>
    <linearGradient id="kkBank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3326"/>
      <stop offset="1" stop-color="#0e2419"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#kkSky)"/>
  <circle cx="940" cy="140" r="60" fill="#fff4d6" opacity="0.85"/>
  <circle cx="940" cy="140" r="140" fill="#fff4d6" opacity="0.18"/>

  <!-- distant snow peaks -->
  <polygon points="0,280 150,180 300,250 470,160 640,250 820,170 980,250 1140,190 1200,240 1200,360 0,360" fill="url(#kkPeak)"/>
  <g fill="#eef2f9" opacity="0.9">
    <polygon points="470,160 510,235 430,232"/>
    <polygon points="820,170 858,240 782,238"/>
  </g>

  <!-- far forested slope -->
  <polygon points="0,360 0,300 1200,300 1200,360 1200,460 0,460" fill="url(#kkForestFar)"/>
  <g fill="#1a5e48" opacity="0.9">
    <polygon points="60,360 80,300 100,360"/>
    <polygon points="180,360 200,302 220,360"/>
    <polygon points="320,360 340,298 360,360"/>
    <polygon points="500,360 520,300 540,360"/>
    <polygon points="720,360 740,302 760,360"/>
    <polygon points="900,360 920,298 940,360"/>
    <polygon points="1080,360 1100,302 1120,360"/>
  </g>

  <!-- UPPER LAKE (Kolsai, deep green) right side -->
  <path d="M620,470 L1200,440 L1200,520 C1000,540 800,530 660,520 C636,518 620,500 620,470 Z" fill="url(#kkLakeUpper)"/>
  <g stroke="#9fe6cf" stroke-width="2" opacity="0.35" fill="none">
    <path d="M760,480 q40,-6 80,0"/>
    <path d="M960,490 q50,-7 100,0"/>
  </g>

  <!-- ridge dividing the two lakes with spruce forest -->
  <polygon points="0,460 220,400 460,470 700,410 940,475 1200,420 1200,560 0,560" fill="url(#kkForestNear)"/>

  <!-- spruce trees on the dividing ridge -->
  <g fill="#0c3a2c">
    <g transform="translate(150,420)"><polygon points="0,0 16,-58 32,0"/><polygon points="3,-22 16,-66 29,-22"/><rect x="13" y="0" width="6" height="12"/></g>
    <g transform="translate(300,452)"><polygon points="0,0 14,-50 28,0"/><polygon points="3,-18 14,-56 25,-18"/><rect x="11" y="0" width="6" height="10"/></g>
    <g transform="translate(560,440)"><polygon points="0,0 17,-62 34,0"/><polygon points="3,-24 17,-70 31,-24"/><rect x="14" y="0" width="6" height="12"/></g>
    <g transform="translate(820,448)"><polygon points="0,0 15,-54 30,0"/><polygon points="3,-20 15,-60 27,-20"/><rect x="12" y="0" width="6" height="11"/></g>
    <g transform="translate(1010,440)"><polygon points="0,0 16,-58 32,0"/><polygon points="3,-22 16,-66 29,-22"/><rect x="13" y="0" width="6" height="12"/></g>
    <g transform="translate(440,460)"><polygon points="0,0 13,-46 26,0"/><rect x="10" y="0" width="5" height="9"/></g>
    <g transform="translate(700,452)"><polygon points="0,0 14,-50 28,0"/><rect x="11" y="0" width="5" height="10"/></g>
  </g>

  <!-- LOWER LAKE KAINDY (front, with sunken bare trunks) -->
  <path d="M0,560 L1200,540 L1200,750 L0,750 Z" fill="url(#kkLakeKaindy)"/>
  <!-- subtle reflection of forest -->
  <rect x="0" y="560" width="1200" height="30" fill="#0b3a2c" opacity="0.2"/>

  <!-- sunken bare tree trunks rising from the water -->
  <g stroke="#d8cdb4" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="220" y1="700" x2="222" y2="500" stroke-width="6"/>
    <line x1="300" y1="720" x2="296" y2="470" stroke-width="7"/>
    <line x1="380" y1="710" x2="382" y2="520" stroke-width="5"/>
    <line x1="640" y1="730" x2="642" y2="488" stroke-width="7"/>
    <line x1="720" y1="715" x2="716" y2="540" stroke-width="5"/>
    <line x1="900" y1="725" x2="902" y2="500" stroke-width="6"/>
    <line x1="980" y1="710" x2="978" y2="540" stroke-width="5"/>
  </g>
  <!-- small bare branches -->
  <g stroke="#c8bca0" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M296,500 l-16,-14 M296,520 l18,-12"/>
    <path d="M642,510 l-18,-12 M642,530 l16,-10"/>
    <path d="M902,520 l-14,-12 M902,540 l16,-10"/>
  </g>
  <!-- water reflections of trunks -->
  <g stroke="#aef0d2" stroke-width="3" opacity="0.25" stroke-linecap="round">
    <line x1="300" y1="722" x2="300" y2="650"/>
    <line x1="642" y1="732" x2="642" y2="660"/>
    <line x1="902" y1="726" x2="902" y2="660"/>
  </g>
  <!-- ripples -->
  <g stroke="#bff5dd" stroke-width="2" opacity="0.3" fill="none">
    <path d="M450,640 q50,-8 100,0"/>
    <path d="M150,690 q55,-9 110,0"/>
    <path d="M760,680 q55,-9 110,0"/>
  </g>

  <text x="46" y="56" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#eef2f9">JEEP<tspan fill="#f59e0b">.ALATAU</tspan></text>
  <text x="44" y="712" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#eef2f9">Kolsai &amp; Kaindy</text>
</svg>
