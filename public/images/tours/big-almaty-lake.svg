<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Big Almaty Lake">
  <defs>
    <linearGradient id="balSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4f8f"/>
      <stop offset="0.55" stop-color="#3f8ad0"/>
      <stop offset="1" stop-color="#bfe3f5"/>
    </linearGradient>
    <radialGradient id="balSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="balPeakFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb0cc"/>
      <stop offset="1" stop-color="#7188aa"/>
    </linearGradient>
    <linearGradient id="balPeakMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7396"/>
      <stop offset="1" stop-color="#3d5072"/>
    </linearGradient>
    <linearGradient id="balPeakNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a55"/>
      <stop offset="1" stop-color="#1a2740"/>
    </linearGradient>
    <linearGradient id="balLake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb7c4"/>
      <stop offset="0.5" stop-color="#1f9bb0"/>
      <stop offset="1" stop-color="#0f7a96"/>
    </linearGradient>
    <linearGradient id="balShore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2740"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#balSky)"/>
  <circle cx="280" cy="150" r="180" fill="url(#balSun)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="540" cy="120" rx="90" ry="22"/>
    <ellipse cx="610" cy="108" rx="60" ry="18"/>
    <ellipse cx="930" cy="170" rx="110" ry="24"/>
    <ellipse cx="1010" cy="158" rx="70" ry="18"/>
  </g>

  <!-- far sharp peaks with snow -->
  <polygon points="0,330 130,180 220,290 360,140 470,300 620,170 760,300 900,150 1040,300 1160,200 1200,270 1200,420 0,420" fill="url(#balPeakFar)"/>
  <g fill="#eef2f9" opacity="0.92">
    <polygon points="360,140 410,235 312,232"/>
    <polygon points="620,170 666,258 576,256"/>
    <polygon points="900,150 950,250 852,248"/>
    <polygon points="130,180 172,272 90,270"/>
  </g>

  <!-- mid ridge -->
  <polygon points="0,400 140,320 300,400 460,330 620,408 800,335 960,405 1120,345 1200,400 1200,470 0,470" fill="url(#balPeakMid)"/>
  <g fill="#dbe3f0" opacity="0.6">
    <polygon points="460,330 498,392 420,390"/>
    <polygon points="800,335 838,396 760,394"/>
  </g>

  <!-- near ridge -->
  <polygon points="0,470 180,420 360,470 540,425 720,472 900,428 1080,470 1200,440 1200,520 0,520" fill="url(#balPeakNear)"/>

  <!-- winding road descending to shore on the left -->
  <path d="M40,470 C150,500 60,540 170,560 C290,582 180,610 300,628 C400,643 350,680 470,700" fill="none" stroke="#2a3650" stroke-width="22" stroke-linecap="round"/>
  <path d="M40,470 C150,500 60,540 170,560 C290,582 180,610 300,628 C400,643 350,680 470,700" fill="none" stroke="#cdd6e6" stroke-width="2" stroke-dasharray="8 14" opacity="0.55"/>

  <!-- left shore landform -->
  <polygon points="0,520 0,750 360,750 300,628 170,560 60,540 40,470 0,490" fill="url(#balShore)"/>
  <!-- pines on shore -->
  <g fill="#0c1a2e">
    <polygon points="90,560 104,520 118,560"/>
    <polygon points="94,544 104,518 114,544"/>
    <polygon points="150,600 166,556 182,600"/>
    <polygon points="155,582 166,554 177,582"/>
    <polygon points="250,650 268,600 286,650"/>
  </g>

  <!-- turquoise lake -->
  <path d="M360,520 L1200,500 L1200,690 C1000,720 760,700 540,712 C460,716 400,700 360,690 Z" fill="url(#balLake)"/>
  <!-- mountain reflection on lake -->
  <g opacity="0.22" fill="#0f3b4a">
    <polygon points="640,520 686,600 600,602"/>
    <polygon points="900,520 950,612 852,610"/>
  </g>
  <!-- ripples -->
  <g stroke="#bfeef3" stroke-width="2" opacity="0.4" fill="none">
    <path d="M500,560 q40,-8 80,0"/>
    <path d="M700,600 q50,-9 100,0"/>
    <path d="M900,640 q60,-10 120,0"/>
    <path d="M560,660 q45,-8 90,0"/>
  </g>

  <!-- right foreground rocks -->
  <polygon points="1200,690 1200,750 700,750 760,710 900,695 1050,705 1200,690" fill="url(#balShore)"/>

  <text x="46" y="56" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#eef2f9">JEEP<tspan fill="#f59e0b">.ALATAU</tspan></text>
  <text x="700" y="724" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#eef2f9">Big Almaty Lake</text>
</svg>
