<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(160deg, #0a0f1a 0%, #0d1f2d 40%, #122a3a 70%, #0a0f1a 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    font-family: sans-serif;
  }
  .container {
    max-width: 800px;
    width: 100%;
    padding: 3rem 1.5rem 4rem;
  }
  header { text-align: center; margin-bottom: 3rem; }
  .surah-title {
    font-family: 'Amiri', serif;
    font-size: 3rem;
    color: #d4af37;
    font-weight: 400;
    line-height: 1.6;
    margin-bottom: 0.5rem;
  }
  .surah-subtitle {
    font-size: 1.1rem;
    color: rgba(212, 175, 55, 0.6);
    letter-spacing: 0.15em;
    font-weight: 300;
  }
  .verses { display: flex; flex-direction: column; gap: 2.5rem; }
  .verse-card {
    background: transparent;
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    position: relative;
    opacity: 0;
    transform: translateY(40px) scale(0.97);
    transition: opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1),
                transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .verse-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .verse-number {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #d4af37, #b8962e);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: #0a0f1a;
    font-weight: 700;
  }
  .arabic {
    text-align: center;
    margin-bottom: 1.5rem;
    font-family: 'Amiri', serif;
    font-size: 1.75rem;
    line-height: 2.2;
    color: #e8dcc8;
    direction: rtl;
    white-space: pre-line;
  }
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0.5rem 0 1.5rem;
  }
  .divider-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(212, 175, 55, 0.4);
  }
  .divider-line {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
  }
  .russian {
    text-align: center;
    font-size: 1rem;
    line-height: 1.9;
    color: rgba(232, 220, 200, 0.65);
    font-weight: 300;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 class="surah-title">سُورَةُ النِّسَاءِ</h1>
    <p class="surah-subtitle">Сура ан-Ниса (Женщины)</p>
  </header>
  <div class="verses" id="verses"></div>
</div>

<script>
const verses = [
  {
    id: 1,
    arabic: 'بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ\nيَـٰٓأَيُّهَا ٱلنَّاسُ ٱتَّقُوا۟ رَبَّكُمُ ٱلَّذِى خَلَقَكُم مِّن نَّفْسٍ وَٰحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَآءً ۚ وَٱتَّقُوا۟ ٱللَّهَ ٱلَّذِى تَسَآءَلُونَ بِهِۦ وَٱلْأَرْحَامَ ۚ إِنَّ ٱللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا',
    russian: 'О люди! Бойтесь вашего Господа, Который сотворил вас из одного человека, сотворил из него пару ему и расселил от них обоих множество мужчин и женщин. Бойтесь Аллаха, именем Которого вы просите друг друга, и бойтесь разрывать родственные связи. Воистину, Аллах наблюдает за вами.',
  },
  {
    id: 2,
    arabic: 'وَءَاتُوا۟ ٱلْيَتَـٰمَىٰٓ أَمْوَٰلَهُمْ ۖ وَلَا تَتَبَدَّلُوا۟ ٱلْخَبِيثَ بِٱلطَّيِّبِ ۖ وَلَا تَأْكُلُوٓا۟ أَمْوَٰلَهُمْ إِلَىٰٓ أَمْوَٰلِكُمْ ۚ إِنَّهُۥ كَانَ حُوبًا كَبِيرًا',
    russian: 'Отдавайте сиротам их имущество и не подменяйте дурным хорошее. Не присваивайте их имущества вместе со своим, ибо это — великий грех.',
  },
  {
    id: 3,
    arabic: 'وَإِنْ خِفْتُمْ أَلَّا تُقْسِطُوا۟ فِى ٱلْيَتَـٰمَىٰ فَٱنكِحُوا۟ مَا طَابَ لَكُم مِّنَ ٱلنِّسَآءِ مَثْنَىٰ وَثُلَـٰثَ وَرُبَـٰعَ ۖ فَإِنْ خِفْتُمْ أَلَّا تَعْدِلُوا۟ فَوَٰحِدَةً أَوْ مَا مَلَكَتْ أَيْمَـٰنُكُمْ ۚ ذَٰلِكَ أَدْنَىٰٓ أَلَّا تَعُولُوا۟',
    russian: 'Если вы боитесь, что не будете справедливы к сиротам, то женитесь на тех женщинах, что приятны вам: на двух, трёх, четырёх. А если боитесь, что не будете одинаково справедливы, то — на одной или на тех, которыми овладели ваши десницы. Это ближе к тому, чтобы вы не были несправедливы.',
  },
];

const container = document.getElementById('verses');
verses.forEach(v => {
  const card = document.createElement('div');
  card.className = 'verse-card';
  card.dataset.id = v.id;
  card.innerHTML = `
    <div class="verse-number">${v.id}</div>
    <p class="arabic">${v.arabic}</p>
    <div class="divider">
      <span class="divider-dot"></span>
      <span class="divider-line"></span>
      <span class="divider-dot"></span>
    </div>
    <p class="russian">${v.russian}</p>
  `;
  container.appendChild(card);
});

let current = 0;
function showNext() {
  if (current < verses.length) {
    document.querySelector(`.verse-card[data-id="${verses[current].id}"]`).classList.add('visible');
    current++;
    setTimeout(showNext, 4000);
  }
}
setTimeout(showNext, 800);
</script>
</body>
</html>
